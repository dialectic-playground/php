# Keeps GitHub Actions (SHA-pinned) and the toolchain image digest current.
# Composer: the locked development tools of each implemented project.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # The release line (PHP 8.5) is a deliberate choice shared with the native CI and
    # `make toolchain`; Dependabot refreshes digests but never changes minor or major versions.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: composer
    directory: /00-hello-world
    schedule:
      interval: weekly
    groups:
      composer-dev:
        dependency-type: development
    commit-message:
      prefix: build
